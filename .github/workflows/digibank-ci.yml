name: DigiBank CI SAST/DAST Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_NAME: ${{ secrets.SONAR_PROJECT_NAME }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  SPRING_PROFILES_ACTIVE : qa

# ---------------------------------------------------------
# 1) BUILD JOB (must run first)
# ---------------------------------------------------------
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build & package (skip tests)
        run: mvn -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t digibank-app:ci .

  # ---------------------------------------------------------
  # 2) Tests & Coverage (all depend on build)
  # ---------------------------------------------------------

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dtest='!RunCucumberTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/**'

  cucumber-tests:
    name: Cucumber Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Cucumber tests
        run: mvn -B test -Dtest='RunCucumberTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Cucumber test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: '**/target/surefire-reports/**'

  jacoco:
    name: JaCoCo Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mvn -B jacoco:prepare-agent test jacoco:report

  # ---------------------------------------------------------
  # 3) PARALLEL SAST JOBS (all depend on tests)
  # ---------------------------------------------------------
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: [unit-tests, cucumber-tests, jacoco]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 obligatoire pour éviter l’erreur "unknown revision"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          # 🔥 On laisse Gitleaks gérer le diff PR automatiquement
          # Pas de "args", car l'action ne supporte pas ce paramètre
          config-path: ""   # utilise la config par défaut

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: results.sarif

  dependency-check:
    name: Dependency-Check (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: [unit-tests, cucumber-tests, jacoco]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: odc-data
          key: ${{ runner.os }}-odc-data
          restore-keys: ${{ runner.os }}-odc-data

      - name: Run OWASP Dependency-Check (aggregate report)
        run: mvn -B org.owasp:dependency-check-maven:aggregate

      - name: Upload OWASP Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs: [ unit-tests, cucumber-tests, jacoco ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install project dependencies
        run: mvn -B clean install -DskipTests
      - name: Run SpotBugs
        run: mvn -B spotbugs:spotbugs

  pmd:
    name: PMD Analysis
    runs-on: ubuntu-latest
    needs: [ unit-tests, cucumber-tests, jacoco ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install project dependencies
        run: mvn -B clean install -DskipTests
      - name: Run PMD
        run: mvn -B org.apache.maven.plugins:maven-pmd-plugin:pmd

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: [ unit-tests, cucumber-tests, jacoco ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Install project dependencies
        run: mvn -B clean install -DskipTests
      - name: Run Checkstyle
        run: mvn -B org.apache.maven.plugins:maven-checkstyle-plugin:checkstyle

  pitest:
    name: Mutation Testing (PITest)
    runs-on: ubuntu-latest
    needs: [unit-tests, cucumber-tests, jacoco]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run PITest mutation coverage
        run: mvn -B clean test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest Mutation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: '**/target/pit-reports/**'

  # ---------------------------------------------------------
  # 4) SONARQUBE (must wait for ALL SAST jobs)
  # ---------------------------------------------------------
  sonar:
    name: Gating (SonarQube Analysis)
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
      - gitleaks
      - dependency-check
      - spotbugs
      - pmd
      - checkstyle
      - pitest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - run: mvn -B clean package -DskipTests

      - uses: actions/download-artifact@v4
        with:
          name: dependency-check-reports
          path: target

      - uses: actions/download-artifact@v4
        with:
          name: pitest-reports
          path: .

      - run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectName="${{ secrets.SONAR_PROJECT_NAME }}"
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------
  # 5) DOCKER (only if SonarQube passes)
  # ---------------------------------------------------------
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sonar
    if: needs.sonar.result == 'success'

    steps:
      - uses: actions/checkout@v4
      - run: docker build -t digibank-app:ci .