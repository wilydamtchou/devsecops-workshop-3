version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: digibank-postgres
    environment:
      POSTGRES_DB: digibankdb
      POSTGRES_USER: digibank
      POSTGRES_PASSWORD: digibank123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digibank"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: digibank-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/digibankdb
      SPRING_DATASOURCE_USERNAME: digibank
      SPRING_DATASOURCE_PASSWORD: digibank123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
